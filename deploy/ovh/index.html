<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monopqojim — Monopoly mondial en ligne</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>" />
  <style>
    html, body { margin: 0; height: 100%; background: #0f0b1e; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: radial-gradient(1200px 800px at 50% -10%, #241a48 0%, #0f0b1e 60%); color: #f4f1ff;
      font: 700 16px Nunito, system-ui, sans-serif; text-align: center; padding: 20px; transition: opacity .4s; z-index: 2; }
    #loader.hidden { opacity: 0; pointer-events: none; }
    #loader h1 { margin: 0; font-size: 42px; font-weight: 900; letter-spacing: 2px; }
    #loader h1 span { color: #a78bfa; }
    #loader small { color: #9d93c4; max-width: 420px; }
    .spin { width: 42px; height: 42px; border: 4px solid #352a5c; border-top-color: #a78bfa; border-radius: 50%; animation: s 1s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
    #retry { display: none; background: #8b5cf6; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div id="loader">
    <h1>MONOP<span>QOJIM</span></h1>
    <div class="spin"></div>
    <div id="msg">Réveil du serveur de jeu…</div>
    <small>Le serveur gratuit se met en veille quand personne ne joue : le premier chargement peut prendre jusqu’à une minute.</small>
    <button id="retry" onclick="location.reload()">Réessayer</button>
  </div>
  <script>
    // Adresse du jeu hébergé sur Render (à adapter si le service porte un autre nom)
    var GAME = 'https://monopqojim.onrender.com';

    // Préfixe de cette page sur le site, ex. /monopqojim
    var base = location.pathname.replace(/\/demo\/?$/, '').replace(/\/(index\.html)?$/, '');
    var params = new URLSearchParams(location.search);
    var room = (params.get('room') || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    var isDemo = /\/demo\/?$/.test(location.pathname);
    var src = GAME + (room ? '/room/' + room : isDemo ? '/demo' : '/');

    var frame = document.createElement('iframe');
    frame.src = src;
    frame.allow = 'clipboard-write; fullscreen; autoplay';
    frame.title = 'Monopqojim';
    document.body.appendChild(frame);

    var loader = document.getElementById('loader');
    var ready = false;
    setTimeout(function () {
      if (ready) return;
      document.getElementById('msg').textContent = 'Le serveur met du temps à répondre…';
      document.getElementById('retry').style.display = 'block';
    }, 90000);

    window.addEventListener('message', function (e) {
      if (e.origin !== GAME || !e.data || typeof e.data !== 'object') return;
      if (e.data.type === 'monopqojim:ready') {
        ready = true;
        loader.classList.add('hidden');
      }
      // garde dans la barre d'adresse un lien partageable vers la partie en cours
      if (e.data.type === 'monopqojim:page') {
        var url = e.data.room ? base + '?room=' + encodeURIComponent(e.data.room) : e.data.demo ? base + '/demo' : base + '/';
        history.replaceState(null, '', url);
      }
    });
  </script>
</body>
</html>
